[build-system]
build-backend = "uv_build"
requires = ["uv-build"]

[dependency-groups]
dev = [
    "prek",
    "pytest",
    "ruff",
    "ty",
    # Remove once https://github.com/astral-sh/uv/issues/14827 is closed.
    "wheel",
]

[project]
authors = [{ email = "atoti-dev@activeviam.com", name = "ActiveViam" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Java",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = []
description = "A JDK shipped in a Python package"
keywords = ["jdk", "java", "jvm", "jre"]
license = "GPL-2.0-only WITH Classpath-exception-2.0"
license-files = ["LICENSE"]
name = "jdk4py"
readme = "README.md"
requires-python = ">=3.10"
version = "25.0.2.1"

[project.urls]
Repository = "https://github.com/activeviam/jdk4py"

[tool.pytest]
filterwarnings = ["error"]
strict = true

[tool.ruff]
fix = true

[tool.ruff.lint]
ignore = [
    "COM812",
    "CPY001",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D203",
    "D211",
    "D212",
    "E501",
    "EM102",
    "ISC001",
    "S101",
    "TRY003",
]
select = ["ALL"]

[tool.ty.terminal]
error-on-warning = true

[tool.uv]
# Keep pinned to ensure same version is used on CI.
required-version = "==0.13.7"
trusted-publishing = "always"
